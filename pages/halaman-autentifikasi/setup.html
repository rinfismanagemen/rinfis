<!DOCTYPE html>
<html lang="id" class="light" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Toko - RINFIS Kasir Modern</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-white dark:from-slate-950 dark:via-slate-900 dark:to-slate-900 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors duration-300">

    <!-- Container Utama -->
    <div class="w-full max-w-xl bg-white/85 dark:bg-slate-900/90 backdrop-blur-xl border border-indigo-100 dark:border-slate-800 shadow-2xl shadow-indigo-100/50 dark:shadow-none rounded-3xl p-8 sm:p-10 relative overflow-hidden transition-all duration-500 my-8">
        
        <!-- Efek Cahaya Latar Belakang Card -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-400/20 dark:bg-purple-900/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-400/20 dark:bg-indigo-900/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Logo & Judul -->
        <div class="text-center mb-8 relative z-10">
            <a href="../../index.html" class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 shadow-lg shadow-indigo-200/50 dark:shadow-none mb-4 hover:scale-105 transition-transform overflow-hidden p-2">
                <img src="../../assets/img/rinfisunguawal.png" alt="Logo RINFIS" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/48'">
            </a>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Konfigurasi Toko Baru</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1.5">Lengkapi profil toko & akun kas utama untuk mulai beroperasional</p>
        </div>

        <!-- Form Setup Toko -->
        <form id="setup-form" class="space-y-5 relative z-10">
            
            <!-- SECTION 1: Informasi Toko -->
            <div class="space-y-4">
                <h2 class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider flex items-center gap-2 border-b border-indigo-50 dark:border-slate-800 pb-2">
                    <i class="fa-solid fa-store"></i> 1. Profil Toko
                </h2>

                <!-- Input Nama Toko -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Nama Toko / Usaha *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 dark:text-slate-500">
                            <i class="fa-solid fa-shop text-sm"></i>
                        </span>
                        <input type="text" id="nama_toko" required placeholder="cth: Kedai Kopi Senja" class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                    </div>
                </div>

                <!-- Input Telepon Toko -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">No. Telepon Toko</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 dark:text-slate-500">
                            <i class="fa-solid fa-phone text-sm"></i>
                        </span>
                        <input type="tel" id="telepon_toko" placeholder="081234567890" class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                    </div>
                </div>

                <!-- Input Alamat Toko -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Alamat Lengkap Toko</label>
                    <div class="relative">
                        <span class="absolute top-3.5 left-0 pl-4 flex items-start text-slate-400 dark:text-slate-500">
                            <i class="fa-solid fa-location-dot text-sm"></i>
                        </span>
                        <textarea id="alamat_toko" rows="2" placeholder="Jl. Sudirman No. 123, Bandung" class="w-full pl-11 pr-4 py-3 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition"></textarea>
                    </div>
                </div>

                <!-- Input Jam Operasional -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Jam Buka</label>
                        <input type="time" id="jam_buka" value="08:00" class="w-full px-4 py-3 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Jam Tutup</label>
                        <input type="time" id="jam_tutup" value="22:00" class="w-full px-4 py-3 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                    </div>
                </div>
            </div>

            <!-- SECTION 2: Akun Kas & Pembayaran Utama -->
            <div class="space-y-4 pt-2">
                <h2 class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider flex items-center gap-2 border-b border-indigo-50 dark:border-slate-800 pb-2">
                    <i class="fa-solid fa-wallet"></i> 2. Akun Pembayaran Utama
                </h2>

                <!-- Input Nama Akun Kas -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Nama Akun *</label>
                        <input type="text" id="nama_akun" required value="Kas Tunai Kasir" placeholder="cth: Kas Tunai Utama" class="w-full px-4 py-3.5 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                    </div>

                    <!-- Input Jenis Pembayaran -->
                    <div class="space-y-1.5">
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Jenis *</label>
                        <select id="jenis_pembayaran" class="w-full px-4 py-3.5 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                            <option value="tunai">Tunai</option>
                            <option value="bank">Bank</option>
                            <option value="e-wallet">E-Wallet</option>
                        </select>
                    </div>
                </div>

                <!-- Input Saldo Awal -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Saldo Awal (Rp)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 dark:text-slate-500 font-semibold text-sm">
                            Rp
                        </span>
                        <input type="number" id="saldo_awal" value="0" min="0" placeholder="0" class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi Utama -->
            <button type="submit" id="submit-btn" class="w-full mt-4 py-4 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-200 dark:shadow-none transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center space-x-2">
                <span id="btn-text">Simpan & Buka Dashboard</span>
                <i id="btn-icon" class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-6 text-center relative z-10 border-t border-indigo-50 dark:border-slate-800 pt-4">
            <p class="text-xs text-slate-400 dark:text-slate-500">RINFIS POS System &copy; 2026</p>
        </div>
    </div>

    <!-- JS Logic Backend dipanggil dari folder process -->
    <script type="module" src="../../process/setup_toko.js"></script>
</body>
</html>
